name: iOS Build & Upload

# Builds the iOS app on a cloud Mac and uploads it to App Store Connect / TestFlight.
# No physical Mac needed. Runs only when you click "Run workflow" (manual).
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   APPSTORE_API_KEY_ID      - the App Store Connect API Key ID (e.g. ABC123XYZ)
#   APPSTORE_API_ISSUER_ID   - the Issuer ID (a UUID)
#   APPSTORE_API_KEY_P8      - the full contents of the AuthKey_XXX.p8 file (paste it in)
#
# Signing is fully automatic via the API key (-allowProvisioningUpdates), so there
# are no certificates or provisioning profiles to manage by hand.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank = auto epoch, always unique)"
        required: false

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      XCODE_PROJECT: ios/App/App.xcodeproj
      SCHEME: App
      TEAM_ID: "59T2D423YY"
      BUNDLE_ID: com.onpointhomeinspect.inspect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          LATEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LATEST" ]; then LATEST=/Applications/Xcode.app; fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: npm ci

      - name: Capacitor sync iOS (adds native plugins incl. RevenueCat)
        run: npx cap sync ios

      - name: Write App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$P8" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          # altool/notarytool also look here:
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$HOME/private_keys/AuthKey_${KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"

      - name: Determine build number
        run: |
          BN="${{ github.event.inputs.build_number }}"
          if [ -z "$BN" ]; then BN="$(date -u +%s)"; fi
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
          echo "Using build number: $BN"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" -scheme "$SCHEME"

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to App Store Connect (TestFlight)
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -o pipefail
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -n1)"
          if [ -z "$IPA" ]; then
            echo "::error::No IPA was produced by the export step."
            exit 1
          fi
          echo "Uploading: $IPA ($(du -h "$IPA" | cut -f1))"

          # altool has been known to exit 0 without actually delivering the build
          # ("green but nothing shows up in App Store Connect"). Run it verbose,
          # capture the output, and only treat the step as successful when altool
          # explicitly reports a successful delivery. Retry once for transient
          # network/Apple hiccups.
          attempt=1
          max=2
          while [ "$attempt" -le "$max" ]; do
            echo "=== Upload attempt $attempt of $max ==="
            set +e
            xcrun altool --upload-app -f "$IPA" -t ios \
              --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --verbose 2>&1 | tee upload.log
            RC=${PIPESTATUS[0]}
            set -e
            if [ "$RC" -eq 0 ] && grep -qiE "No errors uploading|Delivery Successful|UPLOAD SUCCEEDED|has been delivered" upload.log; then
              echo "✅ Build delivered to App Store Connect."
              exit 0
            fi
            echo "Attempt $attempt did not confirm delivery (altool exit code: $RC)."
            attempt=$((attempt + 1))
            [ "$attempt" -le "$max" ] && sleep 15
          done

          echo "::error::altool did not confirm a successful delivery after $max attempts. See the verbose log above for the real reason (auth, network, duplicate build, etc.)."
          exit 1

      - name: Upload IPA as build artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
