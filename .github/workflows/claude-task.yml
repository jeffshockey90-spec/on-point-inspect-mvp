name: Claude coding task

# FLOW's in-app coding agent. The owner submits a task inside FLOW; FLOW fires a
# repository_dispatch (event_type "claude-task") with the task text; the REAL
# Claude Code runs here in GitHub's cloud on a fresh claude/ branch, runs the
# build, and opens a Pull Request for the owner to review + merge from inside
# FLOW. It never pushes to main and never merges itself.
on:
  repository_dispatch:
    types: [claude-task]

permissions:
  contents: write        # push the claude/* branch
  pull-requests: write   # open the PR
  issues: write          # action plumbing
  actions: read          # let Claude read CI results
  id-token: write        # action GitHub App auth

concurrency:
  group: claude-task-${{ github.event.client_payload.task_id }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Placeholder build-time env so `npm run build` can construct the module-scope
    # clients (Supabase/OpenAI/Resend/Stripe) during build. These are FAKE values
    # — the build never makes real calls; real secrets live only at runtime.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service
      OPENAI_API_KEY: sk-placeholder
      RESEND_API_KEY: re_placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
    steps:
      - name: Validate payload
        env:
          TASK_ID: ${{ github.event.client_payload.task_id }}
          TASK: ${{ github.event.client_payload.task }}
        run: |
          [[ "$TASK_ID" =~ ^[A-Za-z0-9-]{8,64}$ ]] || { echo "bad task_id"; exit 1; }
          [[ -n "$TASK" && ${#TASK} -le 55000 ]] || { echo "bad task"; exit 1; }

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      # Give an audit a folder to write into so the Write tool has a real target
      # (harmless for build tasks; git ignores the empty dir until a file lands).
      - name: Prepare report dir
        run: mkdir -p reports

      - name: Claude implements the task
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          branch_prefix: claude/
          prompt: ${{ github.event.client_payload.task }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 150
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(mkdir *),Bash(ls *),Bash(cat *),Bash(find *),Bash(head *),Bash(tail *),Bash(wc *),Bash(npm ci),Bash(npm run build),Bash(npm test),Bash(npm run test:*),Bash(npm run lint),Bash(npm run check:colors),Bash(git status),Bash(git diff *),Bash(git log *)"

      - name: Capture Claude's changes, verify, and open the PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
          REVIEW_BOT_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
          TASK_ID: ${{ github.event.client_payload.task_id }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          git config user.name "FLOW Coder"
          git config user.email "coder@flowinspect.app"
          echo "--- working tree after Claude ---"
          git status --short | head -50
          echo "---------------------------------"

          BRANCH="claude/task-${TASK_ID}"

          if [ -n "$(git status --porcelain)" ]; then
            # Claude left changes in the working tree — capture them.
            git checkout -b "$BRANCH"
            git add -A
            git commit -m "FLOW Coder: ${TASK_ID}"
          else
            # The agent changed no files. If it produced output text, salvage it
            # into a report so Jeff always sees a result; otherwise nothing to open.
            SRC="${EXEC_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
            TEXT=""
            if [ -f "$SRC" ]; then
              TEXT=$(jq -r '
                if type=="array" then
                  ([ .[] | select(.type=="assistant") | .message.content[]? | select(.type=="text") | .text ] | join("\n\n"))
                elif has("result") then .result
                else "" end
              ' "$SRC" 2>/dev/null || true)
            fi
            if [ -n "$TEXT" ]; then
              mkdir -p reports
              { echo "# Claude's reply — ${TASK_ID}"; echo; echo "$TEXT"; } > "reports/audit-${TASK_ID}.md"
              git checkout -b "$BRANCH"
              git add -A
              git commit -m "FLOW Coder: ${TASK_ID}"
            else
              echo "::warning::Claude produced no changes or output — nothing to open."
              exit 0
            fi
          fi

          # Did Claude only write a plain-English report (a "look into it" task), or
          # did it change real app code (a "build/fix" task)? Infer from the files.
          CHANGED=$(git diff --name-only origin/main..HEAD || true)
          if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qvE '^reports/.*\.md$'; then
            IS_REVIEW=1
          else
            IS_REVIEW=0
          fi

          # Independently verify a real change before offering it for review. A
          # review only adds a markdown report (no app code), so skip build/test.
          if [ "$IS_REVIEW" = "0" ]; then
            npm ci
            npm run build
            npm test
          fi

          git remote set-url origin "https://x-access-token:${REVIEW_BOT_TOKEN}@github.com/${REPO}.git"
          git push -u origin "$BRANCH"

          if [ "$IS_REVIEW" = "1" ]; then
            PR_TITLE="App review: ${TASK_ID}"
            PR_INTRO="Here's your plain-English review. Nothing in your app was changed — this is just a report for you to read. You can close it when you're done."
          else
            PR_TITLE="Change to review: ${TASK_ID}"
            PR_INTRO="This is a change Claude made for you. The automatic checks ran and passed. Look it over below and approve it when you're happy — nothing goes live until you say so."
          fi

          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR already exists"
          else
            # Do NOT write the task text into the PR body — it can contain text
            # pulled from an attached client document (name/address/payment info),
            # and a PR description lives in GitHub permanently. The agent already
            # used what it needed; the body just needs a human intro + a ref.
            printf '%s\n\n%s\n' \
              "$PR_INTRO" \
              "Ref: ${TASK_ID}" > /tmp/pr-body.txt
            gh pr create --base main --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body-file /tmp/pr-body.txt
          fi
